name: Bug report
description: Something in Scotty is not working as it should.
labels: [bug]
body:
  - type: input
    id: scotty-version
    attributes:
      label: Scotty version
      description: Shown at the bottom left of the settings window, or About in the tray menu. Say if the PCs differ.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: machines
    attributes:
      label: Each PC's Windows version
      description: One line per PC, and which one has the keyboard and mouse plugged in.
      placeholder: |
        Laptop 1 (keyboard and mouse): Windows 11 25H2
        Laptop 2: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Moving the pointer and keyboard between PCs
        - Copying files between PCs
        - Head turn
        - Pairing or setup
        - Clipboard text or images
        - Something else
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The steps, and which PC was driving which.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Attach Scotty.log from each PC (tray menu, Open log folder), or paste the lines from around the time it went wrong.
        The log holds your PCs' names and local network addresses; remove them if you would rather not share them. It never holds file contents or camera images.
