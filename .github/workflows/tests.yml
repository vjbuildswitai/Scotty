name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Scotty is a Windows app: its tests run where it runs.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: python -m pip install -r win_app/requirements-win.txt
      - name: Verify
        shell: bash
        env:
          PYTHON: python
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/verify.sh
